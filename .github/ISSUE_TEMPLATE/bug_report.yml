name: Bug report
description: The service, its admin page or one of its installers does not behave as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Service version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options: [install.sh, Windows installer (.exe), install-service.ps1, Run by hand, Other]
  - type: input
    id: foundry-version
    attributes:
      label: Foundry VTT version
      placeholder: "13.348"
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: >-
        `journalctl -u foundry-world-backup -n 50` (Linux) or
        `C:\ProgramData\FoundryWorldBackup\logs\service.log` (Windows). Remove your GitHub token before pasting.
      render: text
